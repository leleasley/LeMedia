services:
  lemedia:
    build: .
    container_name: lemedia
    restart: unless-stopped
    network_mode: host
    volumes:
      - lemedia-data:/data
      - ./packages/plugins:/app/packages/plugins
    env_file:
      - .env
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LEMEDIA_SECRET_KEY=${LEMEDIA_SECRET_KEY}
      # connection_limit=1 is REQUIRED, not an optimisation: SQLite allows a single writer, so
      # Prisma's default multi-connection pool makes concurrent writes fight over the write lock
      # until the query socket timeout fires (P1008) — a burst of requests then 500s. Serialising
      # on one connection measured 100/100 writes in ~300ms vs 14/100 failing over 150s.
      - DATABASE_URL=file:///data/${LEMEDIA_DB_FILE:-lemedia.db}?connection_limit=1
      - PORT=3456
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3456
      - SETUP_SECRET=${SETUP_SECRET}
      - INSTALL_FILE_PATH=/data/install.json
      # Trust X-Forwarded-* headers (default true: the proxy is the only thing that can reach
      # the port on host networking). May also be an IP/CIDR allow-list (e.g. TRUST_PROXY=127.0.0.1)
      # or hop count — malformed values fall back to trusting nothing with a boot warning instead
      # of crashing startup. Set to false only when exposed directly (no reverse proxy).
      # - TRUST_PROXY=true
      # Set to true when the proxy terminates TLS: enables HSTS and marks the auth cookie Secure
      # even if the internal hop is plain http.
      # - FORCE_HTTPS=false
      # Only needed to override the two settings above — `true` forces the Secure flag on,
      # `false` forces it off.
      # - COOKIE_SECURE=

volumes:
  lemedia-data:
    # Override LEMEDIA_DATA_VOLUME in .env to use an existing volume under another name.
    name: ${LEMEDIA_DATA_VOLUME:-lemedia-data}
